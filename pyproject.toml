[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diagramlint"
version = "0.0.1"
description = "Check a committed architecture diagram's edges against a statically extracted dependency graph: supported, reversed, invented and missing edges, each with file:line evidence, a machine-readable receipt and a CI exit code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ranadhir Ghosh" }]
keywords = ["architecture", "diagrams", "mermaid", "static-analysis", "ci", "ai-agents"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
diagramlint = "diagramlint.cli:main"
diagramlint-mcp = "diagramlint.mcp_server:main"

[project.urls]
Homepage = "https://github.com/ranadhir19/diagramlint"

[tool.setuptools.packages.find]
where = ["src"]
